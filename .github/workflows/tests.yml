name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Test suite
        run: uv run --frozen pytest -q
      - name: Environment validation
        run: uv run --frozen python -m hedging_gym.validate
